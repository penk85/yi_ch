<template id="scene_6-template">
  <div id="root" class="scene_6-root" data-composition-id="scene_6" data-width="1920" data-height="1080" data-duration="4.096" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--paper-anchor);
        font-family: var(--font-body);
      }
      #root *, #root *::before, #root *::after { box-sizing: border-box; }

      .s6-mesh-bg {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(ellipse at 35% 35%, color-mix(in srgb, var(--brand-primary) 12%, transparent) 0%, transparent 60%),
          radial-gradient(ellipse at 65% 65%, color-mix(in srgb, var(--brand-secondary) 8%, transparent) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 85%, color-mix(in srgb, var(--brand-accent) 6%, transparent) 0%, transparent 50%);
      }

      .s6-particle {
        position: absolute; z-index: 0;
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--brand-primary);
        opacity: 0.12;
      }

      .s6-camera {
        position: relative; z-index: 1;
        width: 100%; height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .s6-list {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: 50%;
        max-width: 960px;
        gap: 0;
      }

      .s6-item {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px 0;
      }

      .s6-chip {
        display: inline-block;
        padding: 6px 16px;
        border-radius: var(--radius-pill);
        background: var(--surface-card);
        color: var(--ink);
        font-family: var(--font-body);
        font-weight: 500;
        font-size: 22px;
        line-height: 1.3;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .s6-chip-accent {
        background: var(--brand-primary);
      }

      .s6-label {
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 400;
        color: var(--ink);
        line-height: 1.4;
      }

      .s6-rule {
        border: none;
        border-top: var(--rule-dashed);
        margin: 0;
        height: 0;
      }
    </style>

    <div class="s6-mesh-bg"></div>
    <div class="s6-particle" style="top:22%;left:15%;"></div>
    <div class="s6-particle" style="top:68%;left:82%;"></div>

    <div class="s6-camera" id="s6-camera">
      <div class="s6-list" id="s6-list">
        <div class="s6-item" id="s6-item-0">
          <span class="s6-chip">Shabbat services</span>
          <span class="s6-label">Weekly rhythm, <em>together</em></span>
        </div>
        <hr class="s6-rule" id="s6-rule-0"/>
        <div class="s6-item" id="s6-item-1">
          <span class="s6-chip">Hebrew school</span>
          <span class="s6-label">Language and identity</span>
        </div>
        <hr class="s6-rule" id="s6-rule-1"/>
        <div class="s6-item" id="s6-item-2">
          <span class="s6-chip">Youth programs</span>
          <span class="s6-label">Growing alongside peers</span>
        </div>
        <hr class="s6-rule" id="s6-rule-2"/>
        <div class="s6-item" id="s6-item-3">
          <span class="s6-chip s6-chip-accent">Community events</span>
          <span class="s6-label">A <em>complete</em> belonging</span>
        </div>
      </div>
    </div>

    <script>
      var EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      var DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var TOTAL = 4.096;

      /* dynamic-content-sequencing: stagger items in by content length */
      var items = ["#s6-item-0","#s6-item-1","#s6-item-2","#s6-item-3"];
      var rules = ["#s6-rule-0","#s6-rule-1","#s6-rule-2"];

      /* center-outward-expansion: items start clustered, expand to positions */
      /* Using staggered entry from center (opacity+y) */
      var staggerDelay = 0.12;
      items.forEach(function(sel, i) {
        tl.fromTo(sel,
          { opacity: 0, y: 30, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: DUR.med, ease: EASE.entry },
          0.2 + i * staggerDelay
        );
      });

      /* Rules fade in between items */
      rules.forEach(function(sel, i) {
        tl.fromTo(sel,
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.3, ease: EASE.entry },
          0.2 + (i + 1) * staggerDelay - 0.05
        );
      });

      /* macro camera: slow dolly-out */
      tl.fromTo("#s6-camera",
        { scale: 1.04 },
        { scale: 1.0, duration: TOTAL, ease: EASE.drift },
        0
      );

      window.__timelines["scene_6"] = tl;
    </script>
  </div>
</template>
