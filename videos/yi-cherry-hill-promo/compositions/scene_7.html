<template id="scene_7-template">
  <div id="root" class="scene_7-root" data-composition-id="scene_7" data-width="1920" data-height="1080" data-duration="3.371" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--paper-anchor);
        font-family: var(--font-body);
      }
      #root *, #root *::before, #root *::after { box-sizing: border-box; }

      .s7-mesh-bg {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(ellipse at 30% 40%, color-mix(in srgb, var(--brand-primary) 12%, transparent) 0%, transparent 60%),
          radial-gradient(ellipse at 70% 55%, color-mix(in srgb, var(--brand-secondary) 8%, transparent) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 80%, color-mix(in srgb, var(--brand-accent) 6%, transparent) 0%, transparent 50%);
      }

      .s7-particle {
        position: absolute; z-index: 0;
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--brand-primary);
        opacity: 0.12;
      }

      .s7-camera {
        position: relative; z-index: 1;
        width: 100%; height: 100%;
      }

      .s7-headline {
        position: absolute;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--font-display);
        font-size: 52px;
        font-weight: 400;
        color: var(--ink);
        text-align: center;
        line-height: 1.25;
        z-index: 3;
      }

      .s7-headline-em {
        color: var(--brand-primary);
        font-style: italic;
      }

      .s7-cloud-wrap {
        position: absolute;
        inset: 0;
        z-index: 2;
      }

      .s7-lines-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .s7-hub {
        position: absolute;
        z-index: 5;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--brand-primary);
        display: grid;
        place-items: center;
      }

      .s7-hub-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--canvas);
      }

      .s7-avatar {
        position: absolute;
        z-index: 2;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--surface-card);
        border: 1.5px solid color-mix(in srgb, var(--ink) 12%, transparent);
        display: grid;
        place-items: center;
        font-size: 28px;
        will-change: transform, opacity;
        transform: translate(-50%, -50%);
      }
    </style>

    <div class="s7-mesh-bg"></div>
    <div class="s7-particle" style="top:15%;left:10%;"></div>
    <div class="s7-particle" style="top:80%;left:88%;"></div>

    <div class="s7-camera" id="s7-camera">
      <div class="s7-headline" id="s7-headline">Warmth <span class="s7-headline-em">multiplied</span></div>

      <div class="s7-cloud-wrap" id="s7-cloud-wrap">
        <svg class="s7-lines-svg" id="s7-lines-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="s7-hub" id="s7-hub">
          <div class="s7-hub-dot"></div>
        </div>
      </div>
    </div>

    <script>
      var EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      var DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var TOTAL = 3.371;

      var CX = 960, CY = 540;
      var RX = 380, RY = 220;
      var AVATAR_COUNT = 8;
      var glyphs = ["\u{1F46A}","\u{1F469}‍\u{1F467}","\u{1F468}‍\u{1F466}","\u{1F9D1}‍\u{1F91D}‍\u{1F9D1}","\u{1F46B}","\u{1F475}","\u{1F476}","\u{1F46A}"];

      var cloudWrap = document.getElementById("s7-cloud-wrap");
      var linesSvg = document.getElementById("s7-lines-svg");
      var avatarEls = [];

      for (var i = 0; i < AVATAR_COUNT; i++) {
        var angle = (i / AVATAR_COUNT) * Math.PI * 2 - Math.PI / 2;
        var ax = CX + Math.cos(angle) * RX;
        var ay = CY + Math.sin(angle) * RY;

        var av = document.createElement("div");
        av.className = "s7-avatar";
        av.style.left = ax + "px";
        av.style.top = ay + "px";
        av.textContent = glyphs[i];
        cloudWrap.appendChild(av);
        avatarEls.push(av);

        var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", CX);
        line.setAttribute("y1", CY);
        line.setAttribute("x2", ax);
        line.setAttribute("y2", ay);
        line.setAttribute("stroke", "color-mix(in srgb, var(--ink) 18%, transparent)");
        line.setAttribute("stroke-width", "1");
        line.setAttribute("stroke-dasharray", "6 8");
        var len = Math.hypot(ax - CX, ay - CY);
        line.style.strokeDashoffset = String(len);
        line.dataset.length = String(len);
        linesSvg.appendChild(line);
      }

      /* headline entry */
      tl.fromTo("#s7-headline",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        0
      );

      /* hub fade in */
      tl.fromTo("#s7-hub",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.4, ease: EASE.entry },
        0.15
      );

      /* avatar cascade */
      avatarEls.forEach(function(av, i) {
        tl.fromTo(av,
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.45, ease: EASE.entry },
          0.4 + i * 0.06
        );
      });

      /* connection lines draw */
      var svgLines = linesSvg.querySelectorAll("line");
      svgLines.forEach(function(line, i) {
        tl.to(line,
          { strokeDashoffset: 0, duration: 0.5, ease: EASE.entry },
          0.7 + i * 0.03
        );
      });

      /* sine-wave-loop: breathing on avatars */
      var breathPhase = { p: 0 };
      var BREATH_START = 1.6;
      var BREATH_DUR = TOTAL - BREATH_START;
      var BREATH_CYCLES = BREATH_DUR / 2.5;
      tl.to(breathPhase, {
        p: Math.PI * 2 * BREATH_CYCLES,
        duration: BREATH_DUR,
        ease: "none",
        onUpdate: function() {
          avatarEls.forEach(function(av, i) {
            var ph = breathPhase.p + (i / avatarEls.length) * Math.PI * 2;
            var s = 1 + Math.sin(ph) * 0.03;
            av.style.transform = "translate(-50%, -50%) scale(" + s + ")";
          });
        }
      }, BREATH_START);

      /* macro camera: slow drift upward */
      tl.fromTo("#s7-camera",
        { y: 6 },
        { y: -6, duration: TOTAL, ease: EASE.drift },
        0
      );

      window.__timelines["scene_7"] = tl;
    </script>
  </div>
</template>
