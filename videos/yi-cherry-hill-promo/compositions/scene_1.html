<template id="scene_1-template">
  <div id="root" class="scene_1-root" data-composition-id="scene_1" data-width="1920" data-height="1080" data-duration="2.709" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--paper-anchor);
        font-family: var(--font-display);
      }
      #root *, #root *::before, #root *::after { box-sizing: border-box; }
      .s1-mesh-bg {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(ellipse at 25% 35%, color-mix(in srgb, var(--brand-primary) 12%, transparent) 0%, transparent 60%),
          radial-gradient(ellipse at 75% 65%, color-mix(in srgb, var(--brand-secondary) 8%, transparent) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 50%, color-mix(in srgb, var(--brand-accent) 6%, transparent) 0%, transparent 50%);
      }
      .s1-content {
        position: relative; z-index: 1;
        width: 100%; height: 100%;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 80px;
      }
      .s1-hero-display {
        font-weight: 500;
        font-size: clamp(120px, 12vw, 200px);
        line-height: 0.92;
        letter-spacing: -0.02em;
        color: var(--ink);
        text-align: center;
        max-width: 1100px;
        margin: 0;
      }
      .s1-hero-display em {
        font-weight: 400;
        font-style: italic;
        color: var(--brand-primary);
      }
      .s1-word {
        display: inline-block;
        opacity: 0;
      }
      .s1-particles {
        position: absolute; inset: 0; z-index: 0;
        pointer-events: none;
      }
      .s1-particle {
        position: absolute;
        width: 6px; height: 6px;
        border-radius: var(--radius-pill);
        background: var(--brand-primary);
        opacity: 0.15;
      }
    </style>

    <div class="s1-mesh-bg"></div>

    <div class="s1-particles" aria-hidden="true">
      <div class="s1-particle" style="left:12%; bottom:20%;"></div>
      <div class="s1-particle" style="left:34%; bottom:10%;"></div>
      <div class="s1-particle" style="left:58%; bottom:15%;"></div>
      <div class="s1-particle" style="left:78%; bottom:25%;"></div>
      <div class="s1-particle" style="left:90%; bottom:8%;"></div>
    </div>

    <div class="s1-content">
      <h1 class="s1-hero-display">
        <span class="s1-word" id="s1-w0">Your</span>
        <span class="s1-word" id="s1-w1">family</span>
        <span class="s1-word" id="s1-w2"><em>belongs</em></span>
        <span class="s1-word" id="s1-w3">here</span>
      </h1>
    </div>

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      var TOTAL = 2.709;
      var words = ["#s1-w0","#s1-w1","#s1-w2","#s1-w3"];
      var staggerGap = 0.12;
      var wordDur = DUR.med;

      words.forEach(function(sel, i) {
        tl.fromTo(sel,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: wordDur, ease: EASE.entry },
          0.1 + i * staggerGap
        );
      });

      tl.fromTo("#root",
        { scale: 0.97 },
        { scale: 1, duration: TOTAL, ease: EASE.drift },
        0
      );

      var particles = document.querySelectorAll(".s1-particle");
      var phase = { p: 0 };
      var IDLE_START = 0.8;
      var IDLE_DUR = TOTAL - IDLE_START;
      var CYCLES = 1;
      tl.to(phase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function() {
          for (var i = 0; i < particles.length; i++) {
            var offset = (i / particles.length) * Math.PI * 2;
            var yShift = Math.sin(phase.p + offset) * 3;
            particles[i].style.transform = "translateY(" + yShift + "px)";
          }
        }
      }, IDLE_START);

      var heroPhase = { p: 0 };
      tl.to(heroPhase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function() {
          var sc = 1 + Math.sin(heroPhase.p) * 0.008;
          var yy = Math.sin(heroPhase.p) * 2;
          document.querySelector(".s1-hero-display").style.transform = "translateY(" + yy + "px) scale(" + sc + ")";
        }
      }, IDLE_START);

      window.__timelines["scene_1"] = tl;
    </script>
  </div>
</template>
