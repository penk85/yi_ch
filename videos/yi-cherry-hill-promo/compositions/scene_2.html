        <div class="s2-accolade-frame" id="s2-accolade">
          <div class="s2-accolade-num" id="s2-accolade-num">0</div>
          <div class="s2-accolade-label">
            among the <span class="s2-accolade-accent">finest places</span> to raise a family
          </div>

    <script>
      var EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      var DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var TOTAL = 3.563;
      var words = ["#s2-w0","#s2-w1","#s2-w2"];
      var staggerGap = 0.14;
      words.forEach(function(sel, i) {
        tl.fromTo(sel,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
          0.1 + i * staggerGap
        );
      });

      tl.fromTo("#s2-accolade",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        0.7
      );

      var state = { value: 0, fontSize: 52 };
      var counterEl = document.getElementById("s2-accolade-num");
      tl.to(state, {
        value: 50,
        fontSize: 72,
        duration: 1.4,
        ease: "power3.out",
        onUpdate: function() {
          counterEl.textContent = "Top " + Math.round(state.value);
          counterEl.style.fontSize = state.fontSize + "px";
        }
      }, 0.9);

      tl.fromTo("#root",
        { x: 0 },
        { x: 20, duration: TOTAL, ease: EASE.drift },
        0
      );

      window.__timelines["scene_2"] = tl;
    </script>
