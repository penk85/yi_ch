<template id="scene_9-template">
  <div id="root" class="scene_9-root" data-composition-id="scene_9" data-width="1920" data-height="1080" data-duration="5.355" style="position:relative; width:1920px; height:1080px; overflow:hidden;">
    <style>
      #root {
        background: var(--canvas);
        font-family: var(--font-body);
      }
      #root *, #root *::before, #root *::after { box-sizing: border-box; }

      .s9-mesh-bg {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(ellipse at 25% 40%, color-mix(in srgb, var(--brand-primary) 12%, transparent) 0%, transparent 60%),
          radial-gradient(ellipse at 75% 60%, color-mix(in srgb, var(--brand-secondary) 10%, transparent) 0%, transparent 55%),
          radial-gradient(ellipse at 50% 80%, color-mix(in srgb, var(--brand-accent) 8%, transparent) 0%, transparent 50%);
      }

      .s9-container {
        position: relative; z-index: 1;
        width: 100%; height: 100%;
        display: flex;
        align-items: center;
        padding: 0 var(--gap-outer);
      }

      .s9-left {
        flex: 0 0 55%;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .s9-name {
        font-family: var(--font-display);
        font-size: 72px;
        line-height: 1.1;
        color: var(--ink);
        opacity: 0;
      }

      .s9-title {
        font-family: var(--font-body);
        font-size: 28px;
        color: var(--ink);
        opacity: 0.7;
        opacity: 0;
      }

      .s9-right {
        flex: 0 0 40%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
        padding-left: 40px;
      }

      .s9-value {
        font-family: var(--font-body);
        font-size: 36px;
        font-style: italic;
        color: var(--ink);
        opacity: 0;
      }

      .s9-value-accent {
        color: var(--brand-primary);
      }

      .s9-dashed-rule {
        width: 60px;
        border: none;
        border-top: var(--rule-dashed);
        margin: 0;
        opacity: 0;
      }
    </style>

    <div class="s9-mesh-bg"></div>

    <div class="s9-container">
      <div class="s9-left">
        <div class="s9-name" id="s9-name"></div>
        <div class="s9-title" id="s9-title">Spiritual leadership</div>
      </div>
      <div class="s9-right">
        <div class="s9-value" id="s9-val1"><em>growth</em></div>
        <hr class="s9-dashed-rule" id="s9-rule1">
        <div class="s9-value s9-value-accent" id="s9-val2"><em>joy</em></div>
        <hr class="s9-dashed-rule" id="s9-rule2">
        <div class="s9-value" id="s9-val3"><em>connection</em></div>
      </div>
    </div>

    <script>
      const EASE = {
        entry: "power2.out",
        emphasis: "power2.inOut",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.5,
        slow: 1.0,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      /* discrete-text-sequence: Rabbi name assembles word by word */
      const nameEl = document.getElementById("s9-name");
      const SEQUENCE = [
        { t: 0.0, text: "" },
        { t: 0.3, text: "Rabbi" },
        { t: 0.7, text: "Rabbi Jonathan" },
        { t: 1.1, text: "Rabbi Jonathan Bienenfeld" },
      ];
      function textAt(time) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i].text;
        }
        return "";
      }
      const driver = { t: 0 };
      tl.to(driver, {
        t: 2.0,
        duration: 2.0,
        ease: "none",
        onUpdate: function() {
          nameEl.textContent = textAt(driver.t);
        }
      }, 0);

      /* Name fade in */
      tl.fromTo("#s9-name", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, 0.1);

      /* Title appears after name */
      tl.fromTo("#s9-title", { opacity: 0, y: 12 }, { opacity: 0.7, y: 0, duration: DUR.med, ease: EASE.entry }, 1.4);

      /* Value words staggered entry */
      tl.fromTo("#s9-val1", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, 1.8);
      tl.fromTo("#s9-rule1", { opacity: 0 }, { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 2.1);

      tl.fromTo("#s9-val2", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, 2.3);
      tl.fromTo("#s9-rule2", { opacity: 0 }, { opacity: 1, duration: DUR.snap, ease: EASE.entry }, 2.6);

      tl.fromTo("#s9-val3", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, 2.8);

      /* sine-wave-loop: slow drift leftward (macro camera) + breathing on name */
      var phase = { p: 0 };
      var IDLE_START = 1.5;
      var IDLE_DUR = 5.355 - IDLE_START;
      var CYCLES = Math.floor(IDLE_DUR / 2.5);
      tl.to(phase, {
        p: Math.PI * 2 * CYCLES,
        duration: IDLE_DUR,
        ease: "none",
        onUpdate: function() {
          var s = 1 + Math.sin(phase.p) * 0.008;
          var yOff = Math.sin(phase.p) * 2;
          nameEl.style.transform = "translateY(" + yOff + "px) scale(" + s + ")";
        }
      }, IDLE_START);

      /* Macro camera: slow drift leftward */
      tl.fromTo(".s9-container",
        { x: 10 },
        { x: -10, duration: 5.355, ease: EASE.drift },
        0
      );

      window.__timelines["scene_9"] = tl;
    </script>
  </div>
</template>
